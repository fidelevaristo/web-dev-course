<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Person</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="container">
      <form>
        <div>
          <label>First Name:</label>
          <input
            type="text"
            class="form-input"
            id="firstName"
            value="Fidel Vicente"
          />
        </div>

        <div>
          <label>Last Name:</label>
          <input type="text" class="form-input" id="lastName" value="Evaristo" />
        </div>

        <div>
          <label>Age:</label>
          <input type="number" class="form-input" id="age" value="25" />
        </div>
      </form>
    </div>

    <script type="module" src="index.js" defer></script>
  </body>
</html>
