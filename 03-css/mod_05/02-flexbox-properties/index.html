<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Properties Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        <div class="column col-yellow">
            <span class="col-title">YELLOW</span>
            <div class="card-item">1</div>
            <div class="card-item">2</div>
            <div class="card-item">3</div>
            <div class="card-item">4</div>
        </div>

        <div class="column col-red">
            <span class="col-title">RED</span>
            <div class="card-item">A</div>
            <div class="card-item">B</div>
            <div class="card-item">C</div>
            <div class="card-item">D</div>
        </div>

        <div class="column col-green">
            <span class="col-title">GREEN</span>
        </div>

        <div class="column col-orange">
            <span class="col-title">ORANGE</span>
        </div>

        <div class="column col-blue">
            <span class="col-title">BLUE</span>
        </div>
    </div>

</body>
</html>
