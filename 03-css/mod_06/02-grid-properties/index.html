<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>CSS Grid Properties</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="grid-complex">
        <div class="area-green">
            <span>GREEN</span>
        </div>

        <div class="area-yellow">
            <span class="area-title">YELLOW</span>
            <div class="cards-grid">
                <div class="card-box">1</div>
                <div class="card-box">2</div>
                <div class="card-box">3</div>
                <div class="card-box">4</div>
            </div>
        </div>

        <div class="area-red">
            <span class="area-title">RED</span>
            <div class="cards-grid">
                <div class="card-box">A</div>
                <div class="card-box">B</div>
                <div class="card-box">C</div>
                <div class="card-box">D</div>
            </div>
        </div>

        <div class="area-blue">
            <span>BLUE</span>
        </div>

        <div class="area-orange">
            <span>ORANGE</span>
        </div>
    </div>

</body>
</html>
