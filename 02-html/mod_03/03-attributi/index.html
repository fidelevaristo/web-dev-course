<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lezione HTML</title>
</head>

<body>

    <button type="button" disabled>Pulsante Disabilitato</button>

    <div>
        <label for="number-input">Numero (intervallo 0-100, step 2):</label>
        <input type="number" id="number-input" name="quantity" min="0" max="100" step="2" autofocus>
    </div>

    <div>
        <label for="check-selected">
            <input type="checkbox" id="check-selected" name="accepted" checked> Casella già selezionata
        </label>
    </div>

    <div>
        <label for="date-input">Seleziona una data:</label>
        <input type="date" id="date-input" name="date">
    </div>

</body>

</html>
