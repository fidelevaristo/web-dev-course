<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Form di Registrazione</title>
</head>
<body>

    <form action="#" method="POST">
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" required>
        </div>

        <div>
            <label for="name">Nome e Cognome:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div>
            <label for="dob">Data di nascita:</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <div>
            <label for="tel">Numero di telefono:</label>
            <input type="tel" id="tel" name="tel" required>
        </div>

        <div>
            <label for="plan">Piano di abbonamento:</label>
            <select id="plan" name="plan">
                <option value="0">Piano Free</option>
                <optgroup label="Piani a pagamento (prezzo crescente)">
                    <option value="basic">Base - 4.99€/mese</option>
                    <option value="standard">Standard - 9.99€/mese</option>
                    <option value="premium">Premium - 19.99€/mese</option>
                </optgroup>
            </select>

            <label for="pro">
                <input type="checkbox" id="pro" name="pro"> Piano Pro
            </label>
        </div>

        <div>
            <label for="cc">Numero carta:</label>
            <input type="text" id="cc" name="cc" required>
        </div>

        <div>
            <label for="cvc">CVC:</label>
            <input type="text" id="cvc" name="cvc" required>
        </div>

        <div>
            <label for="exp">Scadenza:</label>
            <input type="date" id="exp" name="exp" required>
        </div>

        <div>
            <label for="address">Indirizzo di fatturazione:</label>
            <input type="text" id="address" name="address" required>
        </div>

        <button type="submit">Registrati</button>
    </form>

</body>
</html>
