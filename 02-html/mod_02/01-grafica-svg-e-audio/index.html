<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Grafica SVG e Audio</title>
</head>
<body>
    <h1>Grafica SVG e Riproduzione Audio</h1>

    <section>
        <h2>SVG Incorporato Direttamente (Inline)</h2>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
            <circle cx="50" cy="50" r="40" stroke="#007acc" stroke-width="4" fill="#61dafb" />
            <polygon points="50,25 60,65 30,40 70,40 40,65" fill="#ffffff" />
        </svg>
    </section>

    <section>
        <h2>SVG Incluso come Immagine Esterna</h2>
        <img src="icon.svg" alt="Stella SVG esterna" width="64" height="64">
    </section>

    <section>
        <h2>Elemento Audio con Controlli</h2>
        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            Il tuo browser non supporta l'elemento audio.
        </audio>
    </section>
</body>
</html>
